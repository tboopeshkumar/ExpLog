name: ExpLog

options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode on purpose. Swift 6's strict concurrency checking
    # rejects a few shared-state patterns used here (the static ModelContainer,
    # in particular). Worth moving to 6 later, not while getting it running.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETS_SWIFT_STRICT_CONCURRENCY: minimal

# Team ID and bundle-ID prefix come from Config/ExpLog.xcconfig, which
# includes the git-ignored Config/Local.xcconfig. Set there rather than in
# Xcode's Signing pane: `xcodegen generate` rewrites the project file and would
# wipe a team picked in the UI every time.
configFiles:
  Debug: Config/ExpLog.xcconfig
  Release: Config/ExpLog.xcconfig

targets:

  ExpLog:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EXPLOG_BUNDLE_ID_PREFIX).explog
        PRODUCT_NAME: ExpLog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ExpLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        # Read by SharedInbox; must match the keychain group below.
        ExpLogKeychainGroup: $(AppIdentifierPrefix)$(EXPLOG_BUNDLE_ID_PREFIX).explog.shared
        ExpLogAppGroup: group.$(EXPLOG_BUNDLE_ID_PREFIX).explog
    entitlements:
      path: App/ExpLog.entitlements
      properties:
        # Shared keychain: how the share extension passes transactions to the
        # app on a free Apple ID (see Shared/SharedInbox.swift). Free team
        # profiles already grant "<team>.*", so this needs no paid membership.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(EXPLOG_BUNDLE_ID_PREFIX).explog.shared
        # App Group — needs a paid Apple Developer Program membership; with a
        # free Apple ID it fails the build ("provisioning profile does not
        # support the App Groups capability"). After enrolling, uncomment
        # here AND on ShareExtension, then re-run `xcodegen generate`.
        # com.apple.security.application-groups:
        #   - group.$(EXPLOG_BUNDLE_ID_PREFIX).explog

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EXPLOG_BUNDLE_ID_PREFIX).explog.share
        # Distinct from the app's module name — sharing one would collide in the
        # build products. The name shown in the share sheet comes from
        # CFBundleDisplayName below, not from here.
        PRODUCT_NAME: ShareExtension
        PRODUCT_MODULE_NAME: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: ExpLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Text only: this extension exists to receive a selected SMS.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
        ExpLogKeychainGroup: $(AppIdentifierPrefix)$(EXPLOG_BUNDLE_ID_PREFIX).explog.shared
        ExpLogAppGroup: group.$(EXPLOG_BUNDLE_ID_PREFIX).explog
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(EXPLOG_BUNDLE_ID_PREFIX).explog.shared
        # Uncomment together with the app's, after enrolling.
        # com.apple.security.application-groups:
        #   - group.$(EXPLOG_BUNDLE_ID_PREFIX).explog
