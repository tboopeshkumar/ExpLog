<!--
  UAE Dirham sign (U+20C3) as a custom SF Symbol.

  Generated from the CC0 artwork at
  https://commons.wikimedia.org/wiki/File:UAE_Dirham_Symbol.svg, scaled so the
  glyph's height is the text cap height and it sits on the baseline, the same
  as a digit. Only the Regular-M source is provided, so the sign doesn't change
  weight with the text around it; it does scale with it.

  Needed because no iOS 27 font has a glyph for U+20C3 yet — typed as text it
  falls back to the LastResort placeholder box.
-->
